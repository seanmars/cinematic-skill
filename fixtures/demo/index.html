<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>demo</title>
<style>html,body{margin:0;background:#F4EFE6}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Fixture page: picture is a pure function of t (no timers, no state between frames).
const cuts = [0, 1.786, 2.550, 5.714, 8.0];
const ctx = document.getElementById("c").getContext("2d");
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);

window.render = function (t) {
  const shot = Math.max(0, cuts.findIndex((c, i) => t >= c && t < cuts[i + 1]));
  const local = (t - cuts[shot]) / (cuts[shot + 1] - cuts[shot]);
  ctx.fillStyle = "#F4EFE6";
  ctx.fillRect(0, 0, 1920, 1080);
  ctx.save();
  ctx.translate(960, 540);
  ctx.scale(1 + 0.08 * ease(local), 1 + 0.08 * ease(local));
  ctx.fillStyle = "#1F2430";
  ctx.font = "700 96px Inter, sans-serif";
  ctx.textAlign = "center";
  const x = shot === 2 ? -600 + 1200 * ease(local) : 0;
  ctx.fillStyle = "#E4572E";
  ctx.fillRect(x - 120, -60, 240, 120);
  ctx.fillStyle = "#1F2430";
  ctx.fillText(shot === 3 ? "Small ideas travel far." : "idea", shot === 3 ? 0 : x, 200);
  ctx.restore();
};

window.ready = false;
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { window.render(0); window.ready = true; });
</script>
</body>
</html>
